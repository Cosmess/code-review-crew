name: Code Review Crew
description: Multi-agent AI code review for pull requests (security, OWASP Top 10, performance and style) with inline comments and SARIF.
author: Cosme Sousa
branding:
  icon: shield
  color: purple

inputs:
  openai-api-key:
    description: OpenAI API key.
    required: true
  github-token:
    description: Token used to read the pull request and post the review.
    default: ${{ github.token }}
  model:
    description: OpenAI model.
    default: gpt-5-mini
  language:
    description: Language of the review (en, pt-BR or zh-CN). Overrides the language in .crc.yml.
    default: ""
  config:
    description: Path of the Code Review Crew configuration file.
    default: .crc.yml
  post-review:
    description: Posts the review on the pull request, with inline comments.
    default: "true"
  sarif-file:
    description: If set, saves the findings as SARIF to this path (to upload to code scanning).
    default: ""
  fail-on:
    description: Fails the job if there is a finding of this severity or higher (Low, Medium, High, Critical).
    default: ""
  read-repository:
    description: Gives the agents MCP tools to read whole files and the repository conventions (requires actions/checkout).
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Review the pull request
      shell: bash
      # Inputs go through environment variables, never interpolated into the script, to avoid script injection.
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CRC_PROVIDER: openai
        CRC_MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CRC_LANGUAGE: ${{ inputs.language }}
        CRC_CONFIG: ${{ inputs.config }}
        CRC_POST: ${{ inputs.post-review }}
        CRC_SARIF: ${{ inputs.sarif-file }}
        CRC_FAIL_ON: ${{ inputs.fail-on }}
        CRC_READ_REPOSITORY: ${{ inputs.read-repository }}
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::Code Review Crew must run on pull_request events."
          exit 1
        fi

        args=(--pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY")
        if [ "$CRC_POST" = "true" ]; then args+=(--post); fi
        if [ -f "$CRC_CONFIG" ]; then args+=(--config "$CRC_CONFIG"); fi
        if [ -n "$CRC_LANGUAGE" ]; then args+=(--language "$CRC_LANGUAGE"); fi
        if [ -n "$CRC_SARIF" ]; then args+=(--sarif "$CRC_SARIF"); fi
        if [ -n "$CRC_FAIL_ON" ]; then args+=(--fail-on "$CRC_FAIL_ON"); fi
        if [ "$CRC_READ_REPOSITORY" = "true" ]; then args+=(--repo-path "$GITHUB_WORKSPACE"); fi

        dotnet run --project "$GITHUB_ACTION_PATH/src/CodeReviewCrew.Cli" -c Release -- "${args[@]}"
