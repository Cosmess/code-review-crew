# Code Review Crew configuration. Copy it to .crc.yml at the root of your repository.

# Language of the review: en (default), pt-BR or zh-CN.
language: en

# Specialist agents to run (default: all of them).
# Values: security, owasp, performance, style
agents:
  - security
  - owasp
  - performance
  - style

# Findings below this severity are dropped: Info, Low, Medium, High, Critical
minSeverity: Low

# Files that are never reviewed (glob patterns).
ignore:
  - "**/*.Designer.cs"
  - "**/Migrations/**"
  - "docs/**"

# Maximum diff size, in characters, sent to an agent per request.
# Larger diffs are split by file.
maxChunkChars: 60000

# Timeout of each agent call and how many times to retry on failure.
agentTimeoutSeconds: 180
maxRetries: 2

# Extra MCP servers whose tools the specialist agents can use.
# They do NOT inherit the environment variables (API keys stay private): pass what they need in env.
# Reading the repository itself needs no configuration: use --repo-path in the CLI
# (it is on by default in the GitHub Action).
# mcpServers:
#   - name: docs
#     command: npx
#     args: ["-y", "@example/mcp-docs"]
#     env:
#       DOCS_TOKEN: "..."

# Model price in US$ per 1 million tokens, to estimate the cost of a review.
# Check the current values on your provider's pricing page.
# pricing:
#   inputPerMillion: 0.25
#   outputPerMillion: 2.00
